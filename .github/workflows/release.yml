name: Unsigned packaging check

run-name: Unsigned packaging check ${{ github.ref_name }} (not for distribution)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    name: Test unsigned macOS arm64 packaging
    runs-on: macos-26
    steps:
      - name: Check out the tagged source and complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Validate tag and release source
        run: |
          version="$(python scripts/manage-version.py --check)"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            test "$GITHUB_REF_NAME" = "v$version"
            git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          else
            test "$GITHUB_REF" = "refs/heads/main"
          fi
          python scripts/check-publication.py
      - name: Install Python build and test dependencies
        run: |
          python -m pip install --disable-pip-version-check -e '.[dev,package]'
      - name: Build the pinned Lua 5.1 test runtime
        env:
          LUA_ARCHIVE_SHA256: 2640fc56a795f29d28ef15e13c34a47e223960b0240e8cb0a82d9b0738695333
        run: |
          curl --fail --location --output "$RUNNER_TEMP/lua-5.1.5.tar.gz" https://www.lua.org/ftp/lua-5.1.5.tar.gz
          echo "$LUA_ARCHIVE_SHA256  $RUNNER_TEMP/lua-5.1.5.tar.gz" | shasum -a 256 --check
          tar -xzf "$RUNNER_TEMP/lua-5.1.5.tar.gz" -C "$RUNNER_TEMP"
          make -C "$RUNNER_TEMP/lua-5.1.5" generic
          echo "$RUNNER_TEMP/lua-5.1.5/src" >> "$GITHUB_PATH"
      - name: Run the release test suite
        run: |
          python -m pytest
          for test_file in tests/*.lua; do
            lua "$test_file"
          done
      - name: Build the pinned image runtime
        run: python scripts/build-minimal-opencv.py
      - name: Build the distribution archive
        run: python scripts/package-plugin.py
      - name: Create SHA-256 manifest
        working-directory: out/unsigned
        run: shasum -a 256 *.zip > SHA256SUMS
      # Public assets come only from release-local.py export after notarization.
      - name: Upload the unsigned test build (not for distribution)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: UNSIGNED-TEST-ONLY-BatchAutoStraighten-${{ github.ref_name }}-macos-arm64
          path: |
            out/unsigned/*.zip
            out/unsigned/SHA256SUMS
          if-no-files-found: error
          retention-days: 7
